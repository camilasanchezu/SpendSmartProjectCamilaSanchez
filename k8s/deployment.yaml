apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendsmart-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spendsmart
  template:
    metadata:
      labels:
        app: spendsmart
    spec:
      containers:
      - name: spendsmart
        image: camilasanchezu/spendsmart:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"